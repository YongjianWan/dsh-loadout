# awesome-dsh-plugin 提交条目
#
# 把下面内容存成 data/plugins/<owner>__<repo>.yml 提 PR。
# 硬性要求（contributing.md 原文）：
#   1. 仓库 package.json 必须声明 dsh.bundle（只有 dsh.client 会被拒）
#   2. 仓库根必须有 cordis.patch.yml
#   3. 仓库创建满 1 天（CI 自动查）
#   4. 仓库加 dsh-plugin topic
#   5. description 必须属实：写了数字就得能数出来
#   6. 一个 PR 最多 3 条
#
# 本条目按实际实现填写，核对过的数字：
#   - 16 个组：3 个 MCP server 自动分组（chrome-devtools 32 / kimi-cu 13 / context7 2）
#     + 12 个手工前缀组（univer/email/ssh/mnemon/mcp-connector/team/schedule/goal/sandbox/ops/search-ext/agent）
#     + extras 兜底组
#   - 3 个元工具（toolctl / tools_search / tools_call）
#   - 一次实测会话：162 个工具注册，165 个被隐藏（deny=165），基础工具（read/bash/shell）不受影响

url: https://github.com/YongjianWan/dsh-loadout
name: YongjianWan/dsh-loadout
category: tools                              # 或 dev；按需激活工具属于 tools
description:
  en: 'On-demand tool loadout for DSH: MCP tools auto-grouped by server, host plugin tools by prefix. Grouped tools hide by default, activate with one call. Ungrouped tools always visible.'
  zh: 'DSH 的按需工具装配：MCP 工具按 server 自动分组，宿主插件工具按手工前缀分组。进组的默认隐藏、一句话激活，没进组的始终可见。'
# icon: https://raw.githubusercontent.com/YongjianWan/dsh-loadout/main/assets/icon-180.png
# tarball: https://github.com/YongjianWan/dsh-loadout/releases/latest/download/dsh-loadout.tgz
