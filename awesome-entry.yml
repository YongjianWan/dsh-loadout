# awesome-dsh-plugin 提交条目
#
# 把下面内容存成 data/plugins/YongjianWan__dsh-loadout.yml 提 PR。
# 硬性要求（contributing.md 原文）：
#   1. 仓库 package.json 必须声明 dsh.bundle（只有 dsh.client 会被拒）
#   2. 仓库根必须有 cordis.patch.yml
#   3. 仓库创建满 1 天（CI 自动查）
#   4. 仓库加 dsh-plugin topic
#   5. description 必须属实：写了数字就得能数出来
#   6. 一个 PR 最多 3 条
#
# 2026-10-28 决定：描述里一个数字都不写。
# 上次写了"3 个元工具 toolctl"和"16 个组"，改名和实机数一变全成假话；
# 指南明说夸大是打回头号原因，无数字就无风险。

url: https://github.com/YongjianWan/dsh-loadout
name: YongjianWan/dsh-loadout
category: tools
description:
  en: 'On-demand tool loadout for DSH: MCP tools are grouped by server and host plugin tools by prefix. Grouped tools are hidden by default and revealed with one call; tools no rule claims stay visible.'
  zh: 'DSH 的按需工具装配：MCP 工具按 server 自动分组，宿主插件工具按手工前缀分组。进组的默认隐藏、一句话激活，没被规则认领的工具始终可见。'
# icon 可选：GitHub 托管的方形位图（png/jpg/webp），无则回退作者头像
